<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        input[type="button"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 30px;
        }

        input[type="button"]:hover {
            background-color: #45a049;
        }

        #mostrar_productos {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            width: 220px;
            padding: 15px;
            text-align: left;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .card h3 {
            margin: 5px 0;
            font-size: 16px;
            color: #222;
        }

        .card .categoria {
            color: #777;
            font-size: 13px;
        }

        .card .precio {
            color: #4CAF50;
            font-weight: bold;
            font-size: 18px;
        }

        .card .stock {
            font-size: 13px;
            color: #555;
        }
    </style>
</head>
<body>
    <h2>Catálogo y Buscador de Productos</h2>
    <div id="mostrar_productos"></div>
    <input type="button" onclick="mostrar()" value="mostrar Productos">
</body>

<script>
    async function mostrar(){
        try{
            let datos = await fetch("productos.json");
            let productos = await datos.json();
            let contenedor = "";

            for (let i = 0; i < productos.length; i++){
                contenedor += 
                '<div class="card">' +
                    '<img src="' + productos[i].imagen + '">' +
                    '<h3>' + productos[i].nombre + '</h3>' +
                    '<p class="categoria">' + productos[i].categoria + '</p>' +
                    '<p class="precio">$' + productos[i].precio + '</p>' +
                    '<p class="stock">Stock: ' + productos[i].stock + '</p>' +
                '</div>';
            } 
            document.getElementById("mostrar_productos").innerHTML = contenedor;

        } catch (error){
            alert("error de conexion " + error);
        }
    }
</script>
</html>
